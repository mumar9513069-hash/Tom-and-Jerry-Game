<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Cat & Rat Game</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0;
            background-color: #0f0f13;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        h1 { margin: 5px 0; font-size: 1.4rem; color: #fca311; }
        .hud { display: flex; gap: 20px; font-size: 0.95rem; margin-bottom: 5px; font-weight: bold; }
        .hud span { color: #f1c40f; }
        
        #canvas-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
            border: 4px solid #3e2723;
            width: 100%;
            max-width: 600px;
            height: 380px;
        }
        canvas { display: block; width: 100%; height: 100%; }

        .game-over-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(4px);
        }
        .game-over-overlay h2 { color: #e74c3c; font-size: 2rem; margin: 0 0 10px 0; }
        .btn-restart {
            background-color: #fca311; color: #1e1e24; border: none;
            padding: 10px 24px; font-size: 1rem; font-weight: bold;
            border-radius: 20px; cursor: pointer; margin-top: 10px;
        }

        /* Mobile Controls */
        .mobile-controls {
            display: flex; gap: 15px; margin-top: 10px; align-items: center;
        }
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 4px;
        }
        .btn-ctrl {
            background: #2b2d42; color: #fff; border: 1px solid #4a4e69;
            border-radius: 10px; font-size: 1.3rem; display: flex;
            align-items: center; justify-content: center; touch-action: manipulation;
        }
        .btn-ctrl:active { background: #fca311; color: #121214; }
        .up { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 3; }
        .right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <h1>3D Cat vs Rat Arena</h1>
    <div class="hud">
        <div>Cheese: <span id="score">0</span></div>
        <div>Cat Speed Level: <span id="level">1</span></div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="gameOverScreen" class="game-over-overlay">
            <h2>CAUGHT BY CAT!</h2>
            <p>Score: <span id="finalScore" style="color:#fca311;">0</span></p>
            <button class="btn-restart" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <!-- On-screen touch buttons for Android / Phones -->
    <div class="mobile-controls">
        <div class="d-pad">
            <div class="btn-ctrl up" id="btnUp">▲</div>
            <div class="btn-ctrl left" id="btnLeft">◄</div>
            <div class="btn-ctrl down" id="btnDown">▼</div>
            <div class="btn-ctrl right" id="btnRight">►</div>
        </div>
    </div>

    <!-- Three.js Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scoreEl = document.getElementById("score");
        const levelEl = document.getElementById("level");
        const finalScoreEl = document.getElementById("finalScore");
        const gameOverScreen = document.getElementById("gameOverScreen");

        let scene, camera, renderer;
        let ratMesh, catMesh, cheeseMesh;
        let score = 0;
        let isGameOver = false;
        let keys = {};

        // Expanded Room Limits (Arena size)
        const arenaSizeX = 18;
        const arenaSizeZ = 12;

        const rat = { x: -6, z: 0, speed: 0.12, radius: 0.8 };
        const cat = { x: 6, z: 0, speed: 0.055, radius: 1.0 };
        const cheese = { x: 0, z: 0, radius: 0.7 };

        function init() {
            const container = document.getElementById("canvas-container");
            
            // Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e1e24);
            
            camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 16, 14);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gameCanvas"), antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Floor (Expanded Room)
            const floorGeo = new THREE.PlaneGeometry(arenaSizeX * 2, arenaSizeZ * 2);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x4a2c11, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Walls (Boundaries visualization)
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x8d6e63 });
            const wallHeight = 2;
            
            // North Wall
            const nWall = new THREE.Mesh(new THREE.BoxGeometry(arenaSizeX * 2, wallHeight, 0.5), wallMat);
            nWall.position.set(0, wallHeight/2, -arenaSizeZ);
            scene.add(nWall);
            // South Wall
            const sWall = new THREE.Mesh(new THREE.BoxGeometry(arenaSizeX * 2, wallHeight, 0.5), wallMat);
            sWall.position.set(0, wallHeight/2, arenaSizeZ);
            scene.add(sWall);
            // East Wall
            const eWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, wallHeight, arenaSizeZ * 2), wallMat);
            eWall.position.set(arenaSizeX, wallHeight/2, 0);
            scene.add(eWall);
            // West Wall
            const wWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, wallHeight, arenaSizeZ * 2), wallMat);
            wWall.position.set(-arenaSizeX, wallHeight/2, 0);
            scene.add(wWall);

            // --- CREATE 3D RAT (Player) ---
            const ratGroup = new THREE.Group();
            const ratBody = new THREE.Mesh(
                new THREE.SphereGeometry(0.7, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0x888888 })
            );
            ratBody.scale.set(1, 0.8, 1.4);
            ratGroup.add(ratBody);
            scene.add(ratGroup);
            ratMesh = ratGroup;

            // --- CREATE 3D CAT (AI) ---
            const catGroup = new THREE.Group();
            const catBody = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 1.0, 2.0),
                new THREE.MeshStandardMaterial({ color: 0xe67e22 })
            );
            catBody.position.y = 0.5;
            catGroup.add(catBody);

            const catHead = new THREE.Mesh(
                new THREE.SphereGeometry(0.7, 12, 12),
                new THREE.MeshStandardMaterial({ color: 0xd35400 })
            );
            catHead.position.set(0, 1.1, 0.9);
            catGroup.add(catHead);
            scene.add(catGroup);
            catMesh = catGroup;

            // --- CREATE 3D CHEESE ---
            const cheeseGeo = new THREE.ConeGeometry(0.8, 0.8, 4);
            const cheeseMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f });
            cheeseMesh = new THREE.Mesh(cheeseGeo, cheeseMat);
            cheeseMesh.position.y = 0.4;
            scene.add(cheeseMesh);

            spawnCheese();
            setupInput();
            animate();
        }

        function spawnCheese() {
            cheese.x = (Math.random() - 0.5) * (arenaSizeX * 1.5);
            cheese.z = (Math.random() - 0.5) * (arenaSizeZ * 1.5);
            cheeseMesh.position.set(cheese.x, 0.4, cheese.z);
        }

        function setupInput() {
            window.addEventListener("keydown", (e) => { keys[e.key] = true; });
            window.addEventListener("keyup", (e) => { keys[e.key] = false; });

            function bindTouch(id, key) {
                const btn = document.getElementById(id);
                btn.addEventListener("touchstart", (e) => { e.preventDefault(); keys[key] = true; });
                btn.addEventListener("touchend", (e) => { e.preventDefault(); keys[key] = false; });
                btn.addEventListener("mousedown", () => { keys[key] = true; });
                btn.addEventListener("mouseup", () => { keys[key] = false; });
            }
            bindTouch("btnUp", "ArrowUp");
            bindTouch("btnLeft", "ArrowLeft");
            bindTouch("btnDown", "ArrowDown");
            bindTouch("btnRight", "ArrowRight");
        }

        function update() {
            if (isGameOver) return;

            // Rat Movement with strict room boundaries
            let dx = 0, dz = 0;
            if (keys["ArrowUp"] || keys["w"] || keys["W"]) dz -= 1;
            if (keys["ArrowDown"] || keys["s"] || keys["S"]) dz += 1;
            if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dx -= 1;
            if (keys["ArrowRight"] || keys["d"] || keys["D"]) dx += 1;

            if (dx !== 0 && dz !== 0) { dx *= 0.707; dz *= 0.707; }

            rat.x += dx * rat.speed;
            rat.z += dz * rat.speed;

            // Constrain Rat inside Room Walls
            const margin = 1.2;
            rat.x = Math.max(-arenaSizeX + margin, Math.min(arenaSizeX - margin, rat.x));
            rat.z = Math.max(-arenaSizeZ + margin, Math.min(arenaSizeZ - margin, rat.z));

            ratMesh.position.set(rat.x, 0.5, rat.z);
            if (dx !== 0 || dz !== 0) {
                ratMesh.rotation.y = Math.atan2(dx, dz);
            }

            // Cat AI Chasing Rat
            const cdx = rat.x - cat.x;
            const cdz = rat.z - cat.z;
            const cDist = Math.hypot(cdx, cdz);

            if (cDist > 0.1) {
                cat.x += (cdx / cDist) * cat.speed;
                cat.z += (cdz / cDist) * cat.speed;
                catMesh.position.set(cat.x, 0, cat.z);
                catMesh.rotation.y = Math.atan2(cdx, cdz);
            }

            // Check Cheese Collection
            const distToCheese = Math.hypot(rat.x - cheese.x, rat.z - cheese.z);
            if (distToCheese < rat.radius + cheese.radius) {
                score += 10;
                scoreEl.textContent = score;
                cat.speed += 0.005; // Increases cat speed gradually
                levelEl.textContent = (1 + (cat.speed - 0.055) / 0.005).toFixed(0);
                spawnCheese();
            }

            // Check Cat Catches Rat
            if (cDist < rat.radius + cat.radius - 0.2) {
                endGame();
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        function endGame() {
            isGameOver = true;
            finalScoreEl.textContent = score;
            gameOverScreen.style.display = "flex";
        }

        function resetGame() {
            score = 0;
            isGameOver = false;
            scoreEl.textContent = "0";
            levelEl.textContent = "1";
            cat.speed = 0.055;
            rat.x = -6; rat.z = 0;
            cat.x = 6; cat.z = 0;
            gameOverScreen.style.display = "none";
            spawnCheese();
        }

        window.onload = init;
    </script>
</body>
</html>
